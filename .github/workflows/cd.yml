name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline", "Terraform IaC"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy → Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # - name: Conectar a AKS
      #   run: |
      #     az aks get-credentials \
      #       --resource-group rg-devops-academia \
      #       --name aks-staging-devops


      # - name: Helm deploy en Staging
      #   run: |
      #     helm upgrade --install devops-app helm/devops-app \
      #       --namespace staging \
      #       --create-namespace \
      #       --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/devops-app \

            
      - name: Simular deploy en Staging
        run: |
          echo "========================================="
          echo "  DEPLOY A STAGING"
          echo "  Versión: ${{ github.sha }}"
          echo "  Ambiente: staging"
          echo "========================================="
          echo "Deploy completado exitosamente en staging"

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Simular deploy en Producción
        run: |
          echo "========================================="
          echo "  DEPLOY A PRODUCCIÓN"
          echo "  Versión: ${{ github.sha }}"
          echo "  Ambiente: production"
          echo "========================================="
          echo "Deploy completado exitosamente en producción"