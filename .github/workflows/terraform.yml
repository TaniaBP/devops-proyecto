name: Terraform IaC

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Plan y Apply
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Login en Azure
        id: login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ steps.login.outputs.clientId }}
          ARM_CLIENT_SECRET: ${{ steps.login.outputs.clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ steps.login.outputs.subscriptionId }}
          ARM_TENANT_ID: ${{ steps.login.outputs.tenantId }}

      - name: Terraform Apply (solo en main)
        if: github.ref == 'refs/heads/main'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ steps.login.outputs.clientId }}
          ARM_CLIENT_SECRET: ${{ steps.login.outputs.clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ steps.login.outputs.subscriptionId }}
          ARM_TENANT_ID: ${{ steps.login.outputs.tenantId }}
