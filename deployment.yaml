apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: storage-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: app-data-pvc
