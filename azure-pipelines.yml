
# Python package
# Create and test a Python package on multiple Python versions.
# Add steps that analyze code, save the dist with the build record, publish to a PyPI-compatible index, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/python

trigger:
- main

pool:
  vmImage: ubuntu-latest

strategy:
  matrix:
    Python38:
      python.version: '3.8'
    Python39:
      python.version: '3.9'
    Python310:
      python.version: '3.10'
    Python311:
      python.version: '3.11'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'

- script: |
    pip install pytest pytest-azurepipelines
    pytest
  displayName: 'pytest'

trigger:
  branches:
    include:
      - main
 
pool:
  vmImage: 'ubuntu-latest'
 
variables:
  pythonVersion: '3.11'
 
stages:
  - stage: CI
    displayName: 'Integración Continua'
    jobs:
      - job: LintAndTest
        displayName: 'Lint y Tests'
        steps:
          - task: UsePythonVersion@0
            displayName: 'Configurar Python $(pythonVersion)'
            inputs:
              versionSpec: '$(pythonVersion)'
 
          - script: pip install -r requirements.txt
            displayName: 'Instalar dependencias'
 
          - script: flake8 . --max-line-length=100
            displayName: 'Linting con flake8'
 
          - script: pytest tests/ -v
            displayName: 'Tests unitarios'

